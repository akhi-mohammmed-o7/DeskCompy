name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm deskcompy.spec

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/DeskCompy -DestinationPath DeskCompy-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DeskCompy-windows
          path: DeskCompy-windows.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "DeskCompy-windows.zip" \
            --title "DeskCompy $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" "DeskCompy-windows.zip" --clobber

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q activity.py characters.py chatter.py chime.py converse.py custom.py focus_history.py glimmer.py main.py painter.py paths.py reactions.py rewards.py rituals.py safety.py settings_store.py sounds.py sprites.py states.py theme.py tracker.py tricks.py ui_engine.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
